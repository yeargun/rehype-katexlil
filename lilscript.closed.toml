# closed LilScript world. This compiler renames no properties, so extern keys
# keep their names here too and the lane compiles the same settings as
# lilscript.toml.
[javascript]
priority = "size-first"
optimization_level = 6
cost_model = "brotli"
assume_pristine_builtins = true
strip_console = true
candidate_search = "off"

[mangle]
identifiers = true
properties = true
pool_strings = true
